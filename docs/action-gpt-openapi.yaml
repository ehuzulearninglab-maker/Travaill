openapi: 3.1.0
info:
  title: Récepteur de fiches pédagogiques
  version: 1.0.0
servers:
  - url: https://votre-domaine.example
paths:
  /api/fiches/import:
    post:
      operationId: importerFichePedagogique
      summary: Envoyer une fiche pédagogique validée vers la plateforme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret_key
                - fiche
              properties:
                secret_key:
                  type: string
                utilisateur_email:
                  type: string
                  description: Adresse de l’enseignant destinataire, si disponible.
                fiche:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Fiche reçue et enregistrée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  succes:
                    type: boolean
                  message:
                    type: string
                  fiche_id:
                    type: string
