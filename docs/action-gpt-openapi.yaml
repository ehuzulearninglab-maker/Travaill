openapi: 3.1.0
info:
  title: Récepteur de fiches pédagogiques
  version: 1.0.0
servers:
  - url: https://travaill.vercel.app
paths:
  /api/fiches/import:
    post:
      operationId: importerFichePedagogique
      summary: Envoyer une fiche pédagogique validée vers la plateforme.
      security:
        - ImportSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fiche
              properties:
                utilisateur_email:
                  type: string
                  description: Adresse de l’enseignant destinataire, si disponible.
                fiche:
                  type: object
                  required:
                    - fiche_de
                  properties:
                    fiche_de:
                      type: string
                    classe:
                      type: string
                    date:
                      type: string
                    duree:
                      type: string
                    cours:
                      type: string
                    deroulement:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    resultats_attendus:
                      type: string
                  additionalProperties: true
      responses:
        "200":
          description: Fiche reçue et enregistrée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  succes:
                    type: boolean
                  message:
                    type: string
                  fiche_id:
                    type: string
components:
  securitySchemes:
    ImportSecret:
      type: apiKey
      in: header
      name: x-import-secret
